name: dnaging
channels:
  - conda-forge
dependencies:
  - python=3.12
  - slim=5.2       # forward-time single-site simulation
  - numpy
  - scipy          # precompute_freq_trajectory_moments.py: scipy.linalg.expm
  - matplotlib-base  # headless diagnostic and result plots
  # Declared explicitly because the cluster's Conda env update did not link
  # matplotlib-base's transitive Python dependencies into the environment.
  - contourpy
  - cycler
  - fonttools
  - kiwisolver
  - packaging
  - pillow
  - libraqm        # Pillow/Matplotlib runtime text-layout library
  - libjpeg-turbo
  - libwebp-base
  - openjpeg
  - lcms2
  - libtiff
  - lerc
  - zlib-ng
  - pyparsing
  - python-dateutil
  - six            # python-dateutil runtime used by Matplotlib
  - mpmath         # tests/_reference.py: high-precision moment reference
  - pytest
  # Inference imports normalize_tes.build_draw_polarity, which imports
  # build_ancestral_states, which has a top-level `import tszip`. tszip pulls
  # tskit. normalize_tes reads VCFs with stdlib gzip, so no pysam/cyvcf2 needed.
  - tszip
  # Coalescent simulation for validating the model (not just its numerics)
  # against an independent implementation. See TODO.md "Simulation validation".
  - msprime
